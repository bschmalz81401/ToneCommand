[project]
name = "fm9-tone"
status_file = "handsoff-status.json"
acceptance_file = "handsoff-acceptance.json"
event_log = "handsoff-events.jsonl"
verification_log = "handsoff-verifications.jsonl"

[workflow]
max_design_rounds = 3
max_review_rounds = 3
stall_minutes = 10
require_live_verification = true
deployment_requires_explicit_approval = true

[agents]
architect = "codex"
supervisor = "codex"
implementer = "codex"
reviewer = "codex"

[models]
architect = "default"
supervisor = "default"
implementer = "default"
reviewer = "default"

[checks]
# Shell commands the supervisor actually runs via `handsoff_supervisor.py verify`.
# Each criterion's evidence should point at one of these having run, not a
# free-text claim. Example: commands = ["pytest tests/ -q", "npm test"]
commands = [
  ".venv/bin/python -m pytest tests/test_nam_captures.py -q -k scanner",
  "TONECOMMAND_SIM=1 .venv/bin/python -m pytest tests/test_capability_gates.py -q",
  ".venv/bin/python -m pytest tests/test_capability_gates.py -q -k audit",
  ".venv/bin/python -m pytest tests/test_device_handle.py::test_routes_do_not_reach_into_private_device_methods -q",
  "TONECOMMAND_SIM=1 .venv/bin/python -m pytest tests/test_capability_gates.py -q -k invariant",
  ".venv/bin/python -m pytest tests/test_diagnostics.py -q",
  ".venv/bin/python -m pytest tests/test_headrush_client.py -q",
  ".venv/bin/python -m pytest tests/test_headrush_amp_models.py tests/test_grounding_envelope.py -q",
  ".venv/bin/python -m pytest tests/test_headrush_schema.py -q",
]
# Commands that verify the deployed system. Phase 8 is blocked until these
# run successfully after deployment approval. This app has no hosted server;
# "deployed" means pushed to origin/main, which is what a user's local
# install pulls. Live proof is: the pushed commit's own files, run for real
# through the actual replay tool (simulator device, not a mock of the tool).
live_commands = [
  "git fetch origin",
  "git diff --quiet HEAD origin/main -- server.py fm9/adapter.py fm9/device.py tests/test_device_handle.py",
  "TONECOMMAND_SIM=1 .venv/bin/python -m pytest tests/test_device_handle.py -q",
  "TONECOMMAND_SIM=1 .venv/bin/python -m pytest tests/test_validation.py tests/test_modifiers.py -q",
]
# Per-command timeout. A hanging check is killed and recorded as exit 124
# rather than hanging the Supervisor indefinitely.
timeout_seconds = 600

[agent_budget]
architect = 120000
supervisor = 40000
implementer = 160000
reviewer = 100000
followup_design = 100000
