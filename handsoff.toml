[project]
name = "fm9-tone-claude-offline-10"
status_file = "handsoff-status.json"
acceptance_file = "handsoff-acceptance.json"
event_log = "handsoff-events.jsonl"
verification_log = "handsoff-verifications.jsonl"

[workflow]
max_design_rounds = 3
max_review_rounds = 3
stall_minutes = 10
require_live_verification = true
deployment_requires_explicit_approval = true

[agents]
supervisor = "claude"
implementer = "claude"
reviewer = "claude"

[checks]
# Shell commands the supervisor actually runs via `handsoff_supervisor.py verify`.
# Populated incrementally, one entry per acceptance criterion, as each
# criterion is added (fast, focused tests only; the full suite is run once
# after all 10 tickets are implemented, not per-criterion).
commands = [
  ".venv/bin/python -m pytest tests/test_effect_type_notices.py -q",
  ".venv/bin/python -m pytest tests/test_cab_retrieval.py::test_full_catalog_search_finds_entries_outside_curated_subset -q",
  ".venv/bin/python -m pytest tests/test_cab_retrieval.py::test_matching_cab_mentions_are_appended_to_planner_context -q",
  ".venv/bin/python -m pytest tests/test_advisory_separation.py -q",
  ".venv/bin/python -m pytest tests/test_advisory_separation.py::test_open_ended_ambiguous_input_routes_to_chat_not_build -q",
  ".venv/bin/python -m pytest tests/test_tone_review.py::test_bare_amp_cab_only_scene_fails_the_bland_test -q",
  ".venv/bin/python -m pytest tests/test_tone_review.py::test_build_with_no_eq_block_anywhere_fails_review -q",
  ".venv/bin/python -m pytest tests/test_request_tension.py -q",
  ".venv/bin/python -m pytest tests/test_diagnostics.py::test_scrub_redacts_known_secret_patterns -q",
  ".venv/bin/python -m pytest tests/test_diagnostics.py::test_local_log_is_structured_scrubbed_and_expires tests/test_diagnostics.py::test_diagnostics_module_makes_no_network_calls -q",
  ".venv/bin/python -m pytest tests/test_diagnostics.py::test_share_package_is_scrubbed_and_never_sent_automatically -q",
  ".venv/bin/python -m pytest tests/test_diagnostics.py -q",
]
# This isolated run never merges to main and has no FM9 connected, so the
# repo's usual "deployed = pulled from main, checked on real hardware" live
# proof is unreachable by design (see run directive, 2026-09-13). "Live" here
# is redefined honestly as: the exact commit pushed to the isolated branch,
# fetched fresh and run for real (simulator, never a mock) rather than
# trusted from local working-tree state.
live_commands = [
  "git fetch origin claude/offline-10-grounding-quality && git diff --quiet HEAD origin/claude/offline-10-grounding-quality",
  "TONECOMMAND_SIM=1 .venv/bin/python -m pytest tests/ -q",
]
# Per-command timeout. A hanging check is killed and recorded as exit 124
# rather than hanging the Supervisor indefinitely.
timeout_seconds = 900
