name: Bundle macOS app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install . pyinstaller
      - name: Build app
        run: PYTHON=python packaging/build_macos.sh
      - name: Smoke test
        run: python packaging/smoke.py
      - name: Read version
        id: version
        run: echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent dist/ToneCommand.app "ToneCommand-macOS-${{ steps.version.outputs.version }}.zip"
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ToneCommand-macOS-${{ steps.version.outputs.version }}
          path: ToneCommand-macOS-${{ steps.version.outputs.version }}.zip
