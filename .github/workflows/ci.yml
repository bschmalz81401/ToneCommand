name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run test suite (simulator + validation, no hardware)
        run: pytest tests/ -q -n auto
      - name: Verification ladder on the simulator
        run: TONECOMMAND_SIM=1 python tools/preset_doctor.py 0 1
