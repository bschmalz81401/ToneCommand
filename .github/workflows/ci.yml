name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # Windows too (#184): its locale encoding is cp1252, so a text read
    # without an explicit encoding dies on any non-ASCII byte we ship. A
    # Linux-only matrix cannot see that; a user's install did.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run test suite (simulator + validation, no hardware)
        run: pytest tests/ -q -n auto
      - name: Verification ladder on the simulator
        if: runner.os != 'Windows'
        run: TONECOMMAND_SIM=1 python tools/preset_doctor.py 0 1
      - name: Verification ladder on the simulator (Windows)
        if: runner.os == 'Windows'
        run: python tools/preset_doctor.py 0 1
        env:
          TONECOMMAND_SIM: "1"
