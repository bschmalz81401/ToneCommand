[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tonecommand"
version = "1.5.0"
description = "Natural-language tone control for the Fractal FM9 over USB MIDI"
readme = "README.md"
license = {file = "LICENSE"}
# 3.11 or 3.12 only: python-rtmidi 1.5.8 ships prebuilt wheels for CPython
# 3.8 to 3.12 on every platform. On 3.13 or newer pip builds it from source
# with meson, which needs a C++ toolchain most players do not have (seen on
# Windows, 2026-09-20: "Unknown compiler(s)"). A ceiling turns that trace
# into one line from pip naming the Python it wants. The ceiling is the gate
# for #172: it lifts when the supriya-midi backend has passed on the unit.
requires-python = ">=3.11,<3.13"
dependencies = [
    "mido>=1.3,<2",
    # #172: python-rtmidi has wheels for CPython 3.8 to 3.12 only; supriya-midi
    # (a nanobind RtMidi binding) has them to 3.14. fm9/midi_transport.py picks
    # whichever imports. The ceiling above lifts once the supriya path has had
    # its hardware pass (#172 REQ-004); until then no 3.13+ install is offered.
    "python-rtmidi>=1.5,<2; python_version < '3.13'",
    "supriya-midi>=26.9b0; python_version >= '3.13'",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Building tonecommand.com (site/build.py). Not needed to run the app.
site = [
    "markdown>=3.7",
    "Pygments>=2.17",
]

# Reading a YouTube link. Optional on purpose: without these the app runs
# exactly as before and the source field still takes a pasted transcript, a
# page URL, or plain text. yt-dlp does the metadata and subtitles;
# faster-whisper only runs when a video has no captions at all.
video = [
    "yt-dlp>=2026.1",
    "faster-whisper>=1.2",
]

# Hearing a cab IR before choosing it. Optional on purpose, same as video:
# without numpy the app runs exactly as before, the review still lists and
# ranks cabs, and only the PREVIEW button is unavailable, saying so plainly
# rather than failing. numpy is needed because the preview convolves a DI with
# the impulse response.
audition = [
    "numpy>=1.24",
]

dev = [
    "pytest>=8",
    # The suite is dominated by the simulator's settle window, which is
    # deliberate: it models the FM9 applying writes asynchronously and has
    # caught real read-after-write races. The window cannot be shortened
    # without losing that, so the runs go side by side instead. 611 tests in
    # 70s rather than 300s, and each worker is its own process, so the module
    # level state these tests monkeypatch is more isolated, not less.
    "pytest-xdist>=3",
    "httpx>=0.27",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://tonecommand.com"
Documentation = "https://tonecommand.com/docs/"
Source = "https://github.com/monzta1/ToneCommand"
Issues = "https://github.com/monzta1/ToneCommand/issues"

[project.scripts]
tonecommand = "server:main"

[tool.setuptools]
py-modules = ["server"]
# `devices/` holds transports for device families other than the FM9, one
# package each. `fm9` stays where it is: moving it is the maintainer's
# migration to sequence, not a side effect of adding a second device (#33).
packages = ["fm9", "devices", "devices.headrush"]
